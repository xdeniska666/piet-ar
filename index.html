<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Piet-AR Scan | Core</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Подключаем премиальный шрифт Outfit и Roboto Mono для технической информации -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        window.loadErrors = [];
        window.addEventListener('error', function(e) {
            window.loadErrors.push(e.message + ' (в ' + (e.filename ? e.filename.split('/').pop() : 'unknown') + ':' + e.lineno + ')');
        }, true);
    </script>
    
    <script src="aruco_tiny.js?v=2026_06_14_v2"></script>
    
    <style>
        :root {
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --success: #00ff87;
            --success-glow: rgba(0, 255, 135, 0.4);
            --bg: #08090f;
            --surface: rgba(13, 16, 27, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text: #f0f3f8;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Видео отображается аппаратно на заднем плане */
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        /* Полноэкранный контейнер */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Холст накладывается поверх видео для отрисовки графики */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            pointer-events: none;
            display: block;
        }

        /* Интерфейсная панель управления (сверху) */
        #header-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            padding: 16px 24px;
            border-radius: 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 600px;
            margin: 0 auto;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00f3ff, #00ff87);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Roboto Mono', monospace;
            margin-top: 2px;
        }

        /* Панель статуса и отладки (снизу) */
        #status-panel {
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            padding: 20px;
            border-radius: 20px;
            z-index: 10;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff3838;
            box-shadow: 0 0 8px #ff3838;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1.5s infinite alternate;
        }

        .status-dot.detected {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse-success 0.8s infinite alternate;
        }

        .status-text {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .debug-info {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }

        /* Кнопка запуска с неоновым свечением */
        #start-btn {
            position: absolute;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--bg);
            background: linear-gradient(135deg, var(--primary), var(--success));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px var(--success-glow);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        /* Направляющая рамка прицела в центре */
        #reticle-overlay {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px dashed rgba(0, 243, 255, 0.3);
            border-radius: 24px;
            z-index: 5;
            pointer-events: none;
            display: none;
            transition: all 0.3s ease;
        }

        /*#reticle-overlay::before, #reticle-overlay::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--primary);
            border-style: solid;
        }*/

        /* Анимации */
        @keyframes pulse {
            0% { opacity: 0.6; box-shadow: 0 0 4px var(--primary); }
            100% { opacity: 1; box-shadow: 0 0 12px var(--primary); }
        }

        @keyframes pulse-success {
            0% { opacity: 0.6; box-shadow: 0 0 4px var(--success); }
            100% { opacity: 1; box-shadow: 0 0 14px var(--success); }
        }

        #debug-log-panel {
            position: absolute;
            bottom: 80px;
            left: 10px;
            right: 10px;
            height: 120px;
            background: rgba(13, 16, 27, 0.85);
            border: 1px solid var(--primary-glow);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            color: #ffffff;
            overflow-y: auto;
            z-index: 999;
            pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; line-height: 1.3; }
        .log-success { color: var(--success); font-weight: bold; }
        .log-warn { color: #ffb703; }
        .log-error { color: #ff4d4d; }

    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div id="header-panel">
        <div class="brand-info">
            <span class="brand-title">Piet-AR Core</span>
            <span class="brand-subtitle">Status: ARUCO_DICT_5X5_50</span>
        </div>
    </div>

    <!-- Кнопка запуска -->
    <button id="start-btn" onclick="startCamera()">Активировать камеру</button>
    
    <!-- Направляющий прицел по центру -->
    <div id="reticle-overlay"></div>

    <!-- Контейнер для отображения потока -->
    <div id="canvas-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Нижняя панель статуса -->
    <div id="status-panel">
        <div class="status-header">
            <div id="status-indicator" class="status-dot"></div>
            <div id="status-message" class="status-text">Ожидание инициализации...</div>
        </div>
        <div class="debug-info">
            <span id="fps-counter">FPS: --</span>
            <span id="res-counter">Разрешение: --</span>
        </div>
    </div>

    <div id="debug-log-panel"> 
        <div class="log-entry log-warn">🟡 Окно отладки инициализировано. Жду кадры...</div>
    </div>       

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusMessage = document.getElementById('status-message');
        const statusIndicator = document.getElementById('status-indicator');
        const fpsCounter = document.getElementById('fps-counter');
        const resCounter = document.getElementById('res-counter');
        const reticle = document.getElementById('reticle-overlay');
        const startBtn = document.getElementById('start-btn');

        // Фиксируем переменные, чтобы браузер не падал
        let isTrackerReady = true;
        let isProcessing = false;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let detector;
        
        // Виджеты для обновления плашки интерфейса
        const fpsWidget = document.getElementById('fps-counter');
        const detWidget = document.getElementById('status-message');

        async function startCamera() {
            // Проверка загрузки библиотеки jsaruco
            if (typeof AR === 'undefined' || typeof AR.Detector === 'undefined') {
                let errorDetails = (window.loadErrors && window.loadErrors.length > 0) 
                    ? "<br><small style='font-size:0.75rem;color:#ffa0a0;font-family:monospace;display:block;margin-top:5px;line-height:1.2;'>" + window.loadErrors.join("<br>") + "</small>"
                    : "<br><small style='font-size:0.75rem;color:#ffa0a0;display:block;margin-top:5px;'>Причина: Файл не загрузился или сбой инициализации</small>";
                statusMessage.innerHTML = "❌ Ошибка: jsaruco не загрузилась!" + errorDetails;
                statusMessage.style.color = "#ff3838";
                return;
            }

            // Инициализируем детектор
            detector = new AR.Detector();

            try {
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 640, max: 640 },
                        height: { ideal: 480, max: 480 }
                    }
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Скрываем кнопку
                startBtn.style.display = 'none';
                reticle.style.display = 'block';
                
                statusIndicator.className = 'status-dot active';
                statusMessage.innerText = "Инициализация видеопотока...";
                
                // Запускаем цикл рендеринга
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resCounter.innerText = `Разрешение: ${video.videoWidth}x${video.videoHeight}`;
                    logToScreen(`Поток запущен: ${video.videoWidth}x${video.videoHeight}`, 'log-success');
                };

                requestAnimationFrame(processFrame);
            } catch (err) {
                statusMessage.innerHTML = "❌ Ошибка камеры: " + err.message;
                statusMessage.style.color = "#ff3838";
            }
        }

        // 1. Помощник для вывода текста на экран телефона
        function logToScreen(text, type = '') {
            const panel = document.getElementById('debug-log-panel');
            if (!panel) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            panel.appendChild(entry);

            // Автоскролл вниз
            panel.scrollTop = panel.scrollHeight;

            // Ограничиваем количество строк, чтобы не перегружать телефон
            while (panel.childNodes.length > 20) {
                panel.removeChild(panel.firstChild);
            }
        }        

        // 2. Главный цикл обработки кадров
        let lastTrackerState = null; // Для отслеживания смены статуса

        async function processFrame() {
            if (!isTrackerReady) {
                if (lastTrackerState !== false) {
                    logToScreen("⏳ Ожидание готовности трекера...", "log-warn");
                    lastTrackerState = false;
                }    
                requestAnimationFrame(processFrame);
                return;
            }

            if (lastTrackerState === false) {
                logToScreen("🚀 Трекер успешно готов! Начинаю обработку...", "log-success");
                lastTrackerState = true;
            }    

            try {
                // Проверяем, захватывается ли видео
                if (!video.videoWidth || !video.videoHeight) {
                    requestAnimationFrame(processFrame);
                    return;
                }

                // Работаем в честном разрешении 640x480 без scaleFactor, чтобы не ломать детекцию контуров
                const targetWidth = video.videoWidth;
                const targetHeight = video.videoHeight;     

                // Принудительно выставляем размеры холста
                if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    resCounter.innerText = `Матрица: ${targetWidth}x${targetHeight}`;
                    logToScreen(`Геометрия выровнена: ${targetWidth}x${targetHeight}`, 'log-success');
                }    

                // Рисуем кадр
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                // Считаем FPS
                frameCount++;
                const now = performance.now();
                if (now - lastFrameTime >= 1000) {
                    fpsWidget.innerText = `FPS: ${frameCount}`;
                    frameCount = 0;
                    lastFrameTime = now;
                }    
                
                // Запуск детекции
                const t0 = performance.now();
                const markers = detector.detect(imageData);
                const dt = Math.round(performance.now() - t0);

                // Вытаскиваем аудит конвейера
                const rawContours = detector.stage_total_contours || 0; // Шаг 1: Поиск линий
                const candidates = detector.stage_candidates || 0;     // Шаг 2: Четырехугольники
                const finalMarkers = markers.length;                    // Шаг 3: Валидация битов

                // Выводим сквозную аналитику в реальном времени
                statusMessage.innerHTML = `
                    <div style="line-height: 1.4; font-size: 0.85rem;">
                        <div>🔍 Всего линий в кадре: <b>${rawContours}</b></div>
                        <div>📐 Геометрия (4 угла): <b>${candidates}</b></div>
                        <div>🆔 Распознано маркеров: <b style="color:${finalMarkers ? '#00ff87' : '#ff3838'}">${finalMarkers}</b></div>
                        <div style="color: #aaa; margin-top: 2px;">Время обработки: ${dt}ms</div>
                    </div>
                `;

                // Подсвечиваем всё, что вообще смогла зацепить камера на Шаге 2
                if (detector.candidates && detector.candidates.length > 0) {
                    ctx.strokeStyle = "rgba(255, 183, 3, 0.4)";
                    ctx.lineWidth = 2;
                    detector.candidates.forEach(poly => {
                        if (poly.length > 0) {
                            ctx.beginPath();
                            ctx.moveTo(poly[0].x, poly[0].y);
                            for (let i = 1; i < poly.length; i++) {
                                ctx.lineTo(poly[i].x, poly[i].y);
                            }
                            ctx.closePath();
                            ctx.stroke();
                        }
                    });
                }    
                
                // Если маркер успешно распознан
                if (markers && markers.length > 0) {
                    drawGlowingOutline(markers);
                }

            } catch (err) {
                logToScreen(`Ошибка обработки: ${err.message}`, 'log-error');
                console.error(err);
            }

            requestAnimationFrame(processFrame);
        }
        
        function drawGlowingOutline(markers) {
            markers.forEach(marker => {
                const corners = marker.corners;
                
                // 1. Рисуем полупрозрачную светящуюся заливку маркера
                ctx.fillStyle = "rgba(0, 255, 135, 0.15)";
                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                for (let i = 1; i < 4; i++) {
                    ctx.lineTo(corners[i].x, corners[i].y);
                }
                ctx.closePath();
                ctx.fill();

                // 2. Рисуем неоновую обводку ребер
                ctx.strokeStyle = "var(--success)";
                ctx.lineWidth = 4;
                ctx.shadowColor = "rgba(0, 255, 135, 0.8)";
                ctx.shadowBlur = 15;
                
                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                for (let i = 1; i < 4; i++) {
                    ctx.lineTo(corners[i].x, corners[i].y);
                }
                ctx.closePath();
                ctx.stroke();
                
                // Сбрасываем тени, чтобы не тормозило дальше
                ctx.shadowBlur = 0;

                // 3. Рисуем круги-узлы по углам
                ctx.fillStyle = "#ffffff";
                corners.forEach(corner => {
                    ctx.beginPath();
                    ctx.arc(corner.x, corner.y, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = "var(--success)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

                // 4. Пишем ID над маркером с красивым фоном
                const textX = corners[0].x;
                const textY = corners[0].y - 15;
                ctx.fillStyle = "rgba(13, 16, 27, 0.85)";
                ctx.fillRect(textX - 5, textY - 20, 80, 26);
                
                ctx.fillStyle = "var(--success)";
                ctx.font = "bold 14px 'Outfit', sans-serif";
                ctx.fillText(`AR ID: ${marker.id}`, textX, textY - 2);
            });    
        }           
    </script>
</body>
</html>
