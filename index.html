<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Piet-AR</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            z-index: 2;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px;
            border-radius: 12px;
            z-index: 3;
            backdrop-filter: blur(10px);
            font-size: 14px;
            pointer-events: none;
        }
        #product-data {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 16px;
            border-radius: 16px;
            z-index: 3;
            backdrop-filter: blur(10px);
            display: none;
            border-left: 4px solid #ff6600;
            pointer-events: none;
        }
        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            font-size: 28px;
            color: #ffaa00;
            font-weight: bold;
        }
        .product-composition {
            font-size: 14px;
            margin-top: 8px;
            color: #ddd;
        }
        button {
            pointer-events: auto;
            background: #ff6600;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            margin-top: 12px;
            cursor: pointer;
        }
        .scan-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 3;
            white-space: nowrap;
        }
        #start-btn {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #ff6600;
            color: white;
            padding: 14px 28px;
            font-size: 18px;
            border: none;
            border-radius: 40px;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>
<button id="start-btn" disabled>⌛ Загрузка библиотеки...</button>
<div id="product-data">
    <div class="product-name" id="product-name"></div>
    <div class="product-price" id="product-price"></div>
    <div class="product-composition" id="product-composition"></div>
    <button onclick="window.open(document.getElementById('recipe-link').href, '_blank')" id="recipe-btn">📖 Рецепт</button>
    <a id="recipe-link" href="#" target="_blank" style="display:none;"></a>
</div>
<div id="info">
    🎯 Нажмите "Включить камеру"
</div>
<div class="scan-hint" id="scan-hint">
    📷 Камера не запущена
</div>

<script type="text/javascript">
    window.onerror = function(message, source, lineno, colno, error) {
        alert("ОШИБКА: " + message + " на строке " + lineno);
    };

    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let lastDetectedId = -1;
    let streaming = false;
    let cvReady = false;
    let detector = null;
    let animationId = null;
    let cap = null;

    function initDetector() {
        if (!cvReady) return false;
        try {
            // Проверка: есть ли вообще модуль ArUco в этой версии библиотеки
            if (!cv.aruco) {
                document.getElementById('scan-hint').innerHTML = '❌ Ошибка: В OpenCV нет модуля ArUco';
                return false;
            }

            let dictionary = cv.getPredefinedDictionary(cv.DICT_4X4_50);
            let parameters = new cv.aruco_DetectorParameters();

            // 1. Позволяем находить более мелкие и размытые маркеры
            parameters.minMarkerPerimeterRate = 0.02; // Стандарт 0.03, уменьшаем порог

            // Возвращаем мягкую точность для плохих линз
            parameters.polygonalApproxAccuracyRate = 0.05; // Стандарт 0.05
            parameters.minDistanceToBorder = 0;

            // 3. Улучшаем поиск в условиях теней
            parameters.adaptiveThreshWinSizeMin = 3;
            parameters.adaptiveThreshWinSizeMax = 23;
            parameters.adaptiveThreshWinSizeStep = 10;

            detector = new cv.aruco_ArucoDetector(dictionary, parameters);
            console.log("✅ Детектор создан");
            return true;
        } catch(e) {
            // Если детектор не создался, мы увидим почему
            document.getElementById('scan-hint').innerHTML = `❌ Ошибка инициализации: ${e.message}`;
            console.error(e);
            return false;
        }
    }

    async function startCamera() {
        // Проверка на наличие OpenCV перед любым действием
        if (typeof cv === 'undefined') {
            alert("Библиотека OpenCV еще загружается. Пожалуйста, подождите.");
            return;
        }
            
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: {
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }    
            });
            video.srcObject = stream;
            
            await video.play();

            // Инициализируем захват кадров OpenCV один раз здесь
            cap = new cv.VideoCapture(video);

            streaming = true;
            
            // Скрываем кнопку старта
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('info').innerHTML = '🎥 Камера работает';
            document.getElementById('scan-hint').innerHTML = '🔍 Инициализация потока...';

            // Даем браузеру 300мс, чтобы точно определились videoWidth и videoHeight
            setTimeout(() => {
                if (animationId) cancelAnimationFrame(animationId);
                processFrame();
            }, 300);    
            
        } catch(err) {
            document.getElementById('info').innerHTML = '❌ Ошибка камеры: ' + err.message;
            document.getElementById('scan-hint').innerHTML = '❌ Доступ запрещен';
            console.error(err);
        }
    }

    async function processFrame() {
        // Если чего-то не хватает, пишем об этом прямо на экран
        if (!cvReady) { document.getElementById('scan-hint').innerHTML = '⌛ Жду OpenCV...'; return; }
        if (!streaming) { document.getElementById('scan-hint').innerHTML = '⌛ Жду Камеру...'; return; }

        // Попытка переинициализации, если детектор еще не готов
        if (!detector) {
            if (!initDetector()) return;
        }    

        let image = null;
        let gray = null;
        let corners = null;
        let ids = null;
        
        try {
            // Если видео еще не готово, пропускаем кадр
            if (video.videoWidth === 0 || video.videoHeight === 0) {
                animationId = requestAnimationFrame(processFrame);
                return;
            }

            image = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            cap.read(image);
            
            // Уменьшаем до 640x480 для скорости
            let dsize = new cv.Size(640, 480);
            cv.resize(image, image, dsize, 0, 0, cv.INTER_AREA);

            gray = new cv.Mat();
            cv.cvtColor(image, gray, cv.COLOR_RGBA2GRAY);

            // Инициализируем только ОДИН раз
            corners = new cv.MatVector();
            ids = new cv.Mat();

            // 1. Сначала запускаем поиск
            detector.detectMarkers(gray, corners, ids);

            // 2. БЛОК ДЕБАГА
            let statusText = `Углов (кандидатов): ${corners.size()}`;

            if (ids && ids.rows > 0) {
                let markerId = ids.getIntAt(0, 0);
                statusText = `🎯 ID: ${markerId} | Углов: ${corners.size()}`;

                // Отрисовка рамки вокруг маркера
                cv.aruco.drawDetectedMarkers(image, corners, ids);

                if (markerId !== lastDetectedId) {
                    lastDetectedId = markerId;
                    fetchData(markerId);
                }
            }
            
            // Обновляем текст на экране телефона
            document.getElementById('scan-hint').innerHTML = statusText;

            // 3. ВЫВОДИМ КАРТИНКУ НА ЭКРАН
            cv.imshow(canvas, image);

        } catch(e) {
            // Если будет ошибка, мы ее увидим на телефоне!
            document.getElementById('scan-hint').innerHTML = `❌ Ошибка: ${e.message}`;
            console.error(e);
        } finally {
            // Обязательная чистка
            if (image) image.delete();
            if (gray) gray.delete();
            if (corners) corners.delete();
            if (ids) ids.delete();
        }

        animationId = requestAnimationFrame(processFrame);
    }

    function onOpenCvReady() {
        cvReady = true;
        initDetector();

        // Активируем кнопку только когда библиотека полностью готова
        const btn = document.getElementById('start-btn');
        btn.disabled = false;
        btn.innerText = '🎥 Включить камеру';

        if (streaming && !animationId) {
            processFrame();
        }    
        document.getElementById('scan-hint').innerHTML = '📷 Библиотека готова';
    }

    function loadOpenCV() {
        const script = document.createElement('script');
        script.src = 'https://docs.opencv.org/4.10.0/opencv.js';
        script.onload = () => {
            document.getElementById('scan-hint').innerHTML = '📷 OpenCV загружен';
            onOpenCvReady();
        };
        script.onerror = () => {
            document.getElementById('info').innerHTML = '❌ Не удалось загрузить OpenCV.js';
            document.getElementById('scan-hint').innerHTML = '❌ Ошибка загрузки OpenCV';
        };
        document.head.appendChild(script);
    }

    async function fetchData(markerId) {
        try {
            // Используем полный URL твоего бэкенда на Render
            let response = await fetch(`https://piet-ar.onrender.com/api/product/${markerId}`);
            if (response.ok) {
                let product = await response.json();

                // Заполняем поля данными из JSON
                document.getElementById('product-name').innerText = product.name;
                document.getElementById('product-price').innerText = product.price + ' ₽';
                document.getElementById('product-composition').innerText = 'Состав: ' + product.composition;
                document.getElementById('recipe-link').href = product.recipe_url;

                // Показываем карточку товара
                document.getElementById('product-data').style.display = 'block';
            } else {
                console.error("Товар не найден в базе");
            }
        } catch(e) {
            console.error('Ошибка сети или сервера:', e);
        }
    }            

    document.getElementById('start-btn').addEventListener('click', startCamera);
    loadOpenCV();
</script>
</body>
</html>
