<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Piet-AR | Лаборатория отладки</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="aruco_tiny.js?v=2026_06_17_debug_v3"></script>

    <style>
        :root {
            --bg: #0b0d19;
            --surface: rgba(20, 24, 44, 0.95);
            --primary: #00f3ff;
            --success: #00ff87;
            --error: #ff3838;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        #video, #canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        }
        #video { opacity: 0; pointer-events: none; } /* Скрываем сырое видео, рисуем всё через canvas */

        #lab-panel {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-row { display: flex; gap: 8px; margin-bottom: 8px; }
        
        button, select {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { background: rgba(255,255,255,0.2); }
        #btn-freeze { background: var(--primary); color: #000; }
        #btn-freeze.active { background: var(--error); color: #fff; }
        
        /* Окно геометрического брака (ВНИЗУ) */
        #geo-inspector {
            position: absolute;
            bottom: 15px; left: 15px; right: 15px;
            height: 120px;
            background: rgba(11, 13, 25, 0.9);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            overflow-y: auto;
            z-index: 1000;
        }
        .geo-item { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
        
    <div id="lab-panel">
        <div class="panel-row">
            <select id="select-view"></select>
                <button id="btn-freeze">⏸ ЗАМОРОЗИТЬ КАДР</button>
                <button id="btn-mock">🔮 ТЕСТ ЭТАЛОНА</button>
            </select>    
        </div>    
        <div class="panel-row"></div>
            <select id="select-view">
                <option value="normal">Режим: Оригинал (Цветной)</option>
                <option value="thresh">Режим: Бинаризация (Чёрно-белый)</option>
                <option value="contours">Режим: Сетка найденных линий</option>
            </select>
        </div>    
        <div id="status-text" style="font-size: 11px; color: #aaa; text-align: center;">Камера активна. Ищу маркер...</div>
    </div>
        
    <div id="geo-inspector">
        <div style="color: var(--primary); font-weight: bold; margin-bottom: 4px;">🔍 ИНСПЕКТОР ГЕОМЕТРИИ (АНАЛИЗ ЛИНИЙ):</div>
        <div id="geo-log">Ожидание стоп-кадра для калибровки...</div>
    </div>   

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const btnFreeze = document.getElementById('btn-freeze');
        const btnMock = document.getElementById('btn-mock');
        const selectView = document.getElementById('select-view');
        const statusText = document.getElementById('status-text');
        const geoLog = document.getElementById('geo-log');

        let detector = new AR.Detector();
        let isFrozen = false;
        let frozenImageData = null;
        
        // Запуск камеры (сразу просим легкий поток 320x240, чтобы пиксели не плыли)
        const constraints = {
            video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 240 } }
        };

        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Ошибка камеры: " + err.message); });

        // Обработка клика Заморозки
        btnFreeze.addEventListener('click', () => {
            isFrozen = !isFrozen;
            if (isFrozen) {
                btnFreeze.innerText = "▶ ЗАПУСТИТЬ КАМЕРУ";
                btnFreeze.classList.add('active');
                statusText.innerText = "Кадр заморожен. Изучаем структуру пикселей...";
            } else {
                btnFreeze.innerText = "⏸ ЗАМОРОЗИТЬ КАДР";
                btnFreeze.classList.remove('active');
                statusText.innerText = "Камера активна. Ищу маркер...";
                frozenImageData = null;
                requestAnimationFrame(processLoop);
            }
        });
        
        // Кнопка подсовывания идеального эталона ArUco из памяти
        btnMock.addEventListener('click', () => {
            isFrozen = true;
            btnFreeze.innerText = "▶ ЗАПУСТИТЬ КАМЕРУ";
            btnFreeze.classList.add('active');
            statusText.innerText = "Тестирование эталонного цифрового маркера...";

            // Генерируем искусственную картинку идеального маркера (внутренний ID = 0)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#000000";
            ctx.fillRect(40, 80, 160, 160); // Черная рамка
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(72, 112, 96, 96);   // Белое нутро

            // Внутренние биты маркера
            ctx.fillStyle = "#000000";
            ctx.fillRect(72, 112, 32, 32);
            ctx.fillRect(136, 112, 32, 32);
            ctx.fillRect(104, 144, 32, 32);

            frozenImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            analyzeFrame(frozenImageData);
        });

        function processLoop() {
            if (isFrozen) return;
            
            if (video.videoWidth && video.videoHeight) { 
                if (canvas.width !== 240 || canvas.height !== 320) {
                    canvas.width = 240;
                    canvas.height = 320;
                }
                
                // Обычный съём кадра без сглаживания, чтобы зафиксировать сырую ребристость принтера
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currentImgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                analyzeFrame(currentImgData);

            }
            requestAnimationFrame(processLoop);
        }
        
        function analyzeFrame(imageData) {
            // Запускаем детектор
            const markers = detector.detect(imageData) || [];
            
            // Выводим гео-лог углов
            if (window.lastGeometryLog && window.lastGeometryLog.length > 0) {
                let html = "";
                // Берем топ-3 самых крупных контуров на экране
                const sorted = window.lastGeometryLog.sort((a,b) => b.perimeter - a.perimeter).slice(0, 3);
                sorted.forEach((item, index) => {
                    const isSquare = item.detectedCorners === 4;
                    html += `<div class="geo-item">
                        Фигура #${index+1}: Периметр=${item.perimeter}px | 
                        Углов найдено: <b style="color:${isSquare ? 'var(--success)' : 'var(--error)'}">${item.detectedCorners}</b> 
                        ${isSquare ? '(КВАДРАТ ✅)' : '(БРАК ❌)'}
                    </div>`;
                });
                geoLog.innerHTML = html;
            } else {
                geoLog.innerHTML = "<div>Контуры не найдены. Камера видит сплошной фон.</div>";
            }

            // РЕЖИМЫ ОТОБРАЖЕНИЯ (Переключаются на лету через селект)
            const mode = selectView.value;
                
            if (mode === "thresh") {
                // Показываем черно-белый мир детектора (результат бинаризации)
                ctx.putImageData(cvImageToBrowserImageData(detector.thres), 0, 0);
            } else if (mode === "contours") {
                // Показываем сетку вообще всех линий
                ctx.fillStyle = "#000";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 1;
                if (detector.contours) {
                    detector.contours.forEach(c => {
                        ctx.beginPath();
                        for(let i=0; i<c.length; i++) {
                            ctx.lineTo(c[i].x, c[i].y);
                        }    
                        ctx.closePath();
                        ctx.stroke();
                    });
                }
            } else {
                // Обычный цветной режим + отрисовка находок
                if (isFrozen && frozenImageData) {
                    ctx.putImageData(frozenImageData, 0, 0);
                }
            
                // Подсвечиваем кандидатов, которые прошли фильтр углов (оранжевым)
                if (detector.candidates) {
                    ctx.strokeStyle = "orange";
                    ctx.lineWidth = 2;
                    detector.candidates.forEach(p => {
                        ctx.beginPath();
                        ctx.moveTo(p[0].x, p[0].y);
                        for(let i=1; i<4; i++) ctx.lineTo(p[i].x, p[i].y);
                        ctx.closePath();
                        ctx.stroke();
                    });
                }

                // Если маркер полностью распознался — фигачим жирный зеленый неон
                if (markers.length > 0) {
                    statusText.innerText = `🎉 МАРКЕР УСПЕШНО РАСПОЗНАН! ID: ${markers[0].id}`;
                    ctx.strokeStyle = "var(--success)";
                    ctx.lineWidth = 4;
                    ctx.shadowColor = "var(--success)";
                    ctx.shadowBlur = 15;
                    markers.forEach(m => {
                        ctx.beginPath();
                        ctx.moveTo(m.corners[0].x, m.corners[0].y);
                        for(let i=1; i<4; i++) ctx.lineTo(m.corners[i].x, m.corners[i].y);
                        ctx.closePath();
                        ctx.stroke();
                    });
                    ctx.shadowBlur = 0;
                }
            }    
        }        
                    
        // Вспомогательный конвертер внутренней памяти CV в понятный браузеру формат
        function cvImageToBrowserImageData(cvImg) {
            const imgData = ctx.createImageData(cvImg.width, cvImg.height);
            let dst = imgData.data;
            let src = cvImg.data;
            let j = 0;
            for (let i = 0; i < src.length; ++i) { 
                dst[j++] = src[i];
                dst[j++] = src[i];
                dst[j++] = src[i];
                dst[j++] = 255;
            }        
            return imgData;
        }    
        
        video.addEventListener('play', () => { requestAnimationFrame(processLoop); }); 
    </script>
</body>
</html>
