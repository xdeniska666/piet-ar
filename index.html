<!DOCTYPE html>
<html>
<head>
    <title>Piet-AR Scan</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/jsaruco@1.0.0/src/svcl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsaruco@1.0.0/src/aruco.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            display: none;
        }
        canvas {
            width: 100%;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
        #start-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 18px;
            z-index: 20;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="info">Ожидание запуска...</div>
    <button id="start-btn" onclick="startCamera()">Включить камеру</button>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let isProcessing = false;
        let frameCount = 0;
        let detector;

        async function startCamera() {
            // Проверяем, загрузилась ли новая библиотека
            if (typeof AR === 'undefined' || typeof AR.Detector === 'undefined') {
                info.innerHTML = "❌ Ошибка: библиотека jsaruco не загрузилась!";
                return;
            }

            // Инициализируем детектор jsaruco
            detector = new AR.Detector();

            try {
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                document.getElementById('start-btn').style.display = 'none';
                info.innerHTML = "🎥 Камера готова. Ищу оригинальные маркеры (5x5)...";
            
                requestAnimationFrame(processFrame);
            } catch (err) {
                info.innerHTML = "❌ Ошибка камеры: " + err;
            }
        }

        async function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && !isProcessing) {
                isProcessing = true;
                frameCount++;

                try {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Рисуем чистый кадр
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Вызываем детекцию в формате jsaruco
                    const markers = detector.detect(imageData);
        
                    if (markers.length > 0) {
                        drawMarkers(markers);
                        info.innerText = "✅ ID: " + markers[0].id;
                    } else {
                        if (frameCount % 30 === 0) {
                            info.innerText = "🔍 Поиск... Кадр: " + frameCount;
                        }
                    }    
                } catch (e) {
                    console.error(e);
                }

                setTimeout(() => { isProcessing = false; }, 30);
            }
            requestAnimationFrame(processFrame);
        }
        
        function drawMarkers(markers) {
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 4;
            markers.forEach(marker => {
                ctx.beginPath();
                marker.corners.forEach((corner, index) => {
                    if (index === 0) ctx.moveTo(corner.x, corner.y);
                    else ctx.lineTo(corner.x, corner.y);
                });
                ctx.closePath();
                ctx.stroke();
            
                ctx.fillStyle = "#00ff00";
                ctx.font = "20px Arial";
                ctx.fillText("ID: " + marker.id, marker.corners[0].x, marker.corners[0].y - 10);
            });    
        }           
    </script>
</body>
</html>
